<script>
const GAME_ID='pin-palace-bowling';const TS=+(new URLSearchParams(location.search).get('speed')||1);const later=(f,ms)=>setTimeout(f,ms/TS);
// ======================= SCORING (pure; unit-tested) =======================
// SCORE-BEGIN
function scoreGame(rolls){ // rolls: array of pin counts in order. returns {frames:[{r:[..],cum:null|n}], total}
 const fr=[];let i=0;
 for(let f=0;f<10;f++){
  if(f<9){if(i>=rolls.length){fr.push({r:[],cum:null});continue}
   if(rolls[i]==10){fr.push({r:[10],strike:true,i});i+=1}
   else{const r=[rolls[i]];if(i+1<rolls.length)r.push(rolls[i+1]);fr.push({r,spare:r.length==2&&r[0]+r[1]==10,i});i+=r.length}}
  else{fr.push({r:rolls.slice(i,i+3),i,tenth:true})}}
 let cum=0,ok=true;
 for(let f=0;f<10;f++){const F=fr[f];let v=null;
  if(F.tenth){const r=F.r;const need=(r[0]==10||(r.length>=2&&r[0]+r[1]==10))?3:2;if(r.length>=need)v=r.slice(0,need).reduce((a,b)=>a+b,0)}
  else if(F.strike){if(F.i+2<rolls.length)v=10+rolls[F.i+1]+rolls[F.i+2]}
  else if(F.spare){if(F.i+2<rolls.length)v=10+rolls[F.i+2]}
  else if(F.r.length==2)v=F.r[0]+F.r[1];
  if(v==null||!ok){ok=false;F.cum=null}else{cum+=v;F.cum=cum}}
 return{frames:fr,total:cum}}
function frameState(rolls){ // next ball to bowl: {f (0-9), ball (0-2), done, fullRack}
 let i=0;for(let f=0;f<9;f++){if(i>=rolls.length)return{f,ball:0,done:false,fullRack:true};if(rolls[i]==10){i++;continue}if(i+1>=rolls.length)return{f,ball:1,done:false,fullRack:false};i+=2}
 const r=rolls.slice(i);
 if(r.length==0)return{f:9,ball:0,done:false,fullRack:true};
 if(r.length==1)return{f:9,ball:1,done:false,fullRack:r[0]==10};
 if(r.length==2){if(r[0]==10)return{f:9,ball:2,done:false,fullRack:r[1]==10};if(r[0]+r[1]==10)return{f:9,ball:2,done:false,fullRack:true};return{f:9,ball:2,done:true}}
 return{f:9,ball:3,done:true}}
function marks(fr){ // display symbols for a frame
 const r=fr.r,o=[];if(!fr.tenth){if(fr.strike)return['','X'];if(r.length>0)o.push(r[0]==0?'-':r[0]);if(r.length>1)o.push(r[0]+r[1]==10?'/':r[1]==0?'-':r[1]);return o}
 for(let k=0;k<r.length;k++){const p=r[k];if(p==10&&(k==0||(k==1&&r[0]==10)||(k==2&&(r[1]==10||r[0]+r[1]==10&&r[0]!=10))))o.push('X');
  else if(k>0&&((k==1&&r[0]!=10&&r[0]+p==10)||(k==2&&r[1]!=10&&r[0]==10&&r[1]+p==10)))o.push('/');else o.push(p==0?'-':p)}return o}
// SCORE-END
// ======================= PHYSICS (SI units: metres, seconds, kg) =======================
const LANE_W=1.0541,HALF=LANE_W/2,GUT=0.235,HEAD=18.288,PIT=HEAD+0.9,BALL_R=0.1085,PIN_R=0.0605,PIN_M=1.53,G=9.81,PIN_H=0.381;
const PIN_SPOTS=(()=>{const s=[],dx=0.3048/2,dz=0.3048*Math.sqrt(3)/2;const rows=[[0],[-1,1],[-2,0,2],[-3,-1,1,3]];let n=1;rows.forEach((r,ri)=>r.forEach(c=>s.push({n:n++,x:c*dx,z:HEAD+ri*dz})));return s})();
const CONDS=[{name:'House Shot',oil:11.6,desc:'Oil to 38 ft – medium hook'},{name:'Dry Lanes',oil:6.1,desc:'Oil to 20 ft – big hook!'},{name:'Heavy Oil',oil:14.0,desc:'Oil to 46 ft – skids straight'}];
const WEIGHTS=[{lb:10,col:['#ff6ad5','#7a1f6a']},{lb:12,col:['#46c3ff','#0b3c7a']},{lb:14,col:['#ffb84a','#7a3a08']},{lb:16,col:['#38e07a','#0c4a26']}];
let cfg=Object.assign({players:1,cpu:false,cpuSkill:1,weight:2,cond:0,lefty:false},ST.get('cfg',{}));
function muAt(z,x){const oil=CONDS[cfg.cond].oil;const edge=Math.abs(x)>HALF*.55?.6:1; // less oil near the edges (crown pattern)

 if(!full)pins.forEach(p=>{if(!standingIds.includes(p.n)){p.gone=true;p.up=false}})}
function newBallObj(x){const w=WEIGHTS[cfg.weight];return{x,z:-0.3,vx:0,vz:0,wx:0,wy:0,m:w.lb*0.4536,r:BALL_R,inGut:0,done:false,spot:[0,0.6,-0.8],rolling:false,t:0,maxHook:0,hitPins:false,entry:0}}
function throwBall(b,speed,angle,revs){ // angle in radians from straight (positive = right), revs rad/s side rotation (positive hooks LEFT for righty)
 b.vx=Math.sin(angle)*speed;b.vz=Math.cos(angle)*speed;
 // forward roll ~35% at release (skid phase), side rotation for hook
 b.wx=0;b.wz=0;b.wroll=b.vz/b.r*.3;b.wy=revs;b.t=0;b.thrown=true}

 if(b.inGut){b.x=LERP(b.x,Math.sign(b.x)*(HALF+GUT*.5),.1);b.vx=0;b.vz=Math.max(b.vz-0.02*dt,1);b.z+=b.vz*dt;rot(b,dt);if(b.z>PIT)b.done=true;return}

  const mu=muAt(b.z,b.x);
  // contact point velocity: forward slip = vz - r*wroll ; lateral slip = vx - r*wy
  const sz=b.vz-b.r*b.wroll,sx=b.vx-b.r*b.wy,s=HYP(sx,sz);
  if(s>1e-3){const a=mu*G,ax=-a*sx/s,az=-a*sz/s;
   // dv = F/m ; dw = (5/2)F/(m r)  -> slip changes at 7/2 a
   const k=Math.min(1,s/(3.5*a*dt));b.vx+=ax*dt*k;b.vz+=az*dt*k;b.wy-=2.5*ax/b.r*dt*k;b.wroll-=2.5*az/b.r*dt*k;b.rolling=s<0.05}
  b.vz-=0.02*dt;b.maxHook=Math.max(b.maxHook,Math.abs(b.vx))}
 b.x+=b.vx*dt;b.z+=b.vz*dt;rot(b,dt);
 if(Math.abs(b.x)>HALF+0.02&&b.z<HEAD-0.1){b.inGut=1;sfx('gutter');}
 if(Math.abs(b.x)>HALF+GUT+.1-b.r){b.x=Math.sign(b.x)*(HALF+GUT+.1-b.r);b.vx*=-.3}
 if(b.z>PIT)b.done=true}
function rot(b,dt){ // rotate the finger-hole marker by angular velocity (for visible spin)
 const wx=b.inGut?b.vz/b.r:b.wroll,wz=-(b.wy||0);const [x,y,z]=b.spot;// axes: x lateral, y up, z downlane. roll about x axis
 const a=wx*dt,c=Math.cos(a),s=Math.sin(a);let y1=y*c-z*s,z1=y*s+z*c;const a2=wz*dt,c2=Math.cos(a2),s2=Math.sin(a2);let x2=x*c2-y1*s2,y2=x*s2+y1*c2;const l=HYP(x2,y2,z1)||1;b.spot=[x2/l,y2/l,z1/l]}
function collidePins(dt){const b=ball;
 if(!b.inGut&&!b.done){for(const p of pins){if(p.gone)continue;const dx=p.x-b.x,dz=p.z-b.z,rr=b.r+(p.up?PIN_R:PIN_R*1.4),d=HYP(dx,dz);if(d<rr&&d>0){const nx=dx/d,nz=dz/d,rv=(b.vx-p.vx)*nx+(b.vz-p.vz)*nz;
   const ov=rr-d,mt=b.m+PIN_M;b.x-=nx*ov*PIN_M/mt;b.z-=nz*ov*PIN_M/mt;p.x+=nx*ov*b.m/mt;p.z+=nz*ov*b.m/mt;
